<!doctype html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZeroDymu</title>
  <meta name="description" content="ZeroDymu — spokojny kurs i panel wspierający życie bez dymu. Prototyp.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ZeroDymu">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">

  <!-- Motyw przed pierwszym renderem (bez migotania). Klucz musi się zgadzać z js/model.js. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('zerodymu:sonnet:data');
        var pref = raw && JSON.parse(raw).settings.theme;
        var dark = pref === 'dark' ||
          (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#0e1413';
      } catch (e) {
        /* brak localStorage lub uszkodzone dane — zostaje motyw domyślny */
      }
    })();
  </script>

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/screens.css">
</head>
<body>
  <a class="skip-link" href="#view">Przejdź do treści</a>

  <div class="app">
    <div class="banner" id="banner" role="status" hidden></div>

    <main class="view" id="view" tabindex="-1">
      <div class="state state--loading" role="status">
        <span class="sr-only">Ładowanie aplikacji…</span>
        <div class="skeleton skeleton--title"></div>
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--card"></div>
      </div>
      <noscript>
        <div class="state state--error">
          <h1 class="state__title">Potrzebny jest JavaScript</h1>
          <p class="state__text">ZeroDymu działa w przeglądarce i wymaga włączonego JavaScriptu.</p>
        </div>
      </noscript>
    </main>

    <nav class="tabbar" aria-label="Główna nawigacja">
      <div class="tabbar__inner">
        <a class="tab" href="#/kurs" data-tab="kurs">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 6.5C10.5 5 8 4.5 4.5 4.5v13c3.5 0 6 .5 7.5 2 1.5-1.5 4-2 7.5-2v-13C16 4.5 13.5 5 12 6.5z"/><path d="M12 6.5v13"/></svg>
          </span>
          <span class="tab__label">Kurs</span>
        </a>
        <a class="tab" href="#/panel" data-tab="panel">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3.5" y="3.5" width="7" height="8" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="14.5" width="7" height="6" rx="2"/></svg>
          </span>
          <span class="tab__label">Panel</span>
        </a>
        <a class="tab" href="#/ustawienia" data-tab="ustawienia">
          <span class="tab__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
          </span>
          <span class="tab__label">Ustawienia</span>
        </a>
      </div>
    </nav>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
